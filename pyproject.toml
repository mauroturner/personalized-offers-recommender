[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personaloffers"
version = "0.1.0"
description = "A personal offer for every customer, built by itself every week: baskets and a recommender over UCI Online Retail II, a ready control group and a CRM hand-off."
# 3.11 on the developer machine (Windows); the service image of U20 stays inside the same range (decision D35).
requires-python = ">=3.11,<3.14"
# Runtime and development dependencies are pinned in requirements.txt and requirements-dev.txt (decision D35).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "src" makes the package importable without installing it; "." makes tests.fixtures importable.
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --import-mode=importlib --durations=10 -m 'not real_data and not docker'"
markers = [
    "real_data: needs the real UCI workbook in data/raw/ (not selected by default)",
    "docker: needs Docker (not selected by default)",
    "slow: one of the tests the plan names as slow (section 24.1); informative, it is not excluded",
]
